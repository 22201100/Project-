
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Street Light</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #111827;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.5s;
}

body.on {
    background: #30334d;
}

.scene {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 600px;
    overflow: hidden;
    background: linear-gradient(#20204e, #45405b 65%, #4c493c);
}

.title {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 34px;
    font-weight: bold;
}

/* Houses */
.house {
    position: absolute;
    bottom: 115px;
    background: #101923;
    width: 35%;
    height: 220px;
    clip-path: polygon(0 30%, 50% 0, 100% 30%, 100% 100%, 0 100%);
}

.house.left {
    left: -5%;
}

.house.right {
    right: -5%;
    height: 210px;
}

.window {
    position: absolute;
    width: 15px;
    height: 23px;
    background: #fff0a5;
    box-shadow: 0 0 12px #ffe58a;
    opacity: 0.9;
}

.house .w1 {
    top: 100px;
    left: 25%;
}

.house .w2 {
    top: 140px;
    left: 65%;
}

.house.right .w1 {
    left: 25%;
}

.house.right .w2 {
    left: 65%;
}

/* Road */
.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 145px;
    background: #55513e;
    border-radius: 50% 50% 0 0;
}

.road {
    position: absolute;
    bottom: -60px;
    left: -10%;
    width: 120%;
    height: 145px;
    border-radius: 50%;
    background: #81794d;
    border-top: 12px solid #383b32;
}

/* Light beams */
.beam {
    position: absolute;
    top: 145px;
    left: 50%;
    width: 0;
    height: 0;
    transform: translateX(-50%);
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 300px solid rgba(255, 239, 150, 0);
    filter: blur(5px);
    transition: border-top-color 0.4s;
    pointer-events: none;
    z-index: 2;
}

body.on .beam {
    border-top-color: rgba(255, 239, 150, 0.35);
}

/* Ground glow */
.glow {
    position: absolute;
    bottom: 22px;
    left: 50%;
    width: 0;
    height: 0;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(255, 235, 130, 0);
    box-shadow: 0 0 0 transparent;
    transition: all 0.4s;
    z-index: 3;
    pointer-events: none;
}

body.on .glow {
    width: 350px;
    height: 55px;
    background: rgba(255, 235, 130, 0.55);
    box-shadow: 0 0 50px 25px rgba(255, 226, 120, 0.25);
}

/* Clickable lamp */
.lamp {
    position: absolute;
    left: 50%;
    top: 105px;
    transform: translateX(-50%);
    width: 90px;
    height: 405px;
    cursor: pointer;
    z-index: 5;
    border: none;
    background: transparent;
}

.lamp:focus-visible {
    outline: 2px solid white;
    outline-offset: 5px;
}

.pole {
    position: absolute;
    left: 42px;
    top: 65px;
    width: 8px;
    height: 300px;
    background: linear-gradient(90deg, #172334, #334a68, #101c2c);
}

.base {
    position: absolute;
    bottom: 0;
    left: 25px;
    width: 42px;
    height: 65px;
    background: linear-gradient(90deg, #172334, #334a68, #101c2c);
    clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
}

.arm {
    position: absolute;
    top: 53px;
    left: 28px;
    width: 35px;
    height: 9px;
    background: #263951;
}

.lamp-head {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 45px;
    height: 38px;
    background: #172334;
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
}

.bulb {
    position: absolute;
    top: 31px;
    left: 30px;
    width: 33px;
    height: 25px;
    background: #4c5364;
    clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
    transition: all 0.4s;
}

body.on .bulb {
    background: #fff4a8;
    filter: drop-shadow(0 0 12px #ffe477);
}

.status {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 16px;
    background: rgba(0, 0, 0, 0.4);
    padding: 10px 18px;
    border-radius: 20px;
    z-index: 10;
    white-space: nowrap;
}
</style>
</head>

<body>
<div class="scene">

    <div class="title">Street Light</div>

    <div class="house left">
        <div class="window w1"></div>
        <div class="window w2"></div>
    </div>

    <div class="house right">
        <div class="window w1"></div>
        <div class="window w2"></div>
    </div>

    <div class="ground"></div>
    <div class="road"></div>

    <div class="beam"></div>
    <div class="glow"></div>

    <button class="lamp"
        id="lamp"
        aria-label="Turn street light on or off"
        aria-pressed="false">

        <div class="lamp-head"></div>
        <div class="bulb"></div>
        <div class="arm"></div>
        <div class="pole"></div>
        <div class="base"></div>

    </button>

    <div class="status" id="status">
        Click the lamp to turn it ON
    </div>

</div>

<script>
const lamp = document.getElementById("lamp");
const status = document.getElementById("status");

lamp.addEventListener("click", function () {
    document.body.classList.toggle("on");

    const isOn = document.body.classList.contains("on");

    lamp.setAttribute("aria-pressed", isOn);

    status.textContent = isOn
        ? "Street Light: ON 💡"
        : "Street Light: OFF 🌙";
});
</script>
</body>
</html>
